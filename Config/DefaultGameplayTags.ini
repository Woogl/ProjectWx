[/Script/GameplayTags.GameplayTagsSettings]
; 어빌리티 태그 규칙 정립(2026-08-13)으로 개명·제거된 태그를 기존 에셋에서 받아준다.
; 참조 에셋: GA_Attack_Light(State.Dodge·ANS.ComboWindow), BT_Custer(State.HitReact), AM_Attack_L|LL|LLL(ANS.ComboWindow),
;            TP_LockOn·TP_Attack_250·TP_Attack_1000·TP_Attack_10000(State.Dead), WBP_Nameplate_Enemy(State.Groggy).
; 위 에셋들을 에디터에서 재저장하면 제거해도 된다.
+GameplayTagRedirects=(OldTagName="State.Dodge",NewTagName="Ability.Dodge")
+GameplayTagRedirects=(OldTagName="State.HitReact",NewTagName="Ability.HitReact")
+GameplayTagRedirects=(OldTagName="ANS.ComboWindow",NewTagName="State.ComboWindow")
+GameplayTagRedirects=(OldTagName="State.Dead",NewTagName="Ability.Death")
+GameplayTagRedirects=(OldTagName="State.Groggy",NewTagName="Ability.Groggy")

; GE가 부여하는 조건을 Effect 네임스페이스로 분리(2026-08-14).
; 전수 검색에서 옛 이름을 참조하는 에셋은 없었다 — 태그 소실은 에셋의 조건이 경고 없이 비는 실패라 보험으로만 남긴다.
+GameplayTagRedirects=(OldTagName="State.Invincible",NewTagName="Effect.Invincible")
+GameplayTagRedirects=(OldTagName="State.Guard",NewTagName="Effect.Guard")
+GameplayTagRedirects=(OldTagName="State.PerfectGuard",NewTagName="Effect.PerfectGuard")
+GameplayTagRedirects=(OldTagName="State.Exhausted",NewTagName="Effect.Exhausted")
+GameplayTagRedirects=(OldTagName="State.SuperArmor",NewTagName="Effect.SuperArmor")

; 래그돌은 조건이 아니라 사건이므로 Event로 분리(2026-08-14).
; 참조 에셋: TP_LockOn·TP_Attack_250·TP_Attack_1000·TP_Attack_10000이 대상 제외 필터로 참조한다.
; 이 필터는 같은 프리셋의 State.Dead(→Ability.Death)와 중복이므로, 프리셋에서 걷어내고 재저장하면 이 줄도 지울 수 있다.
+GameplayTagRedirects=(OldTagName="State.Ragdoll",NewTagName="Event.Ragdoll")
