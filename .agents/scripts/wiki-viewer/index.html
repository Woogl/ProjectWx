:root{color-scheme:light;--bg:#f4f3ef;--ink:#222b29;--muted:#65716b;--line:#dedfd7;--accent:#245c48}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.65 'Segoe UI','Malgun Gothic',sans-serif}button,input,select{font:inherit}button,a,select{touch-action:manipulation}button{cursor:pointer}a{color:var(--accent)}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #b37c2b;outline-offset:3px}.shell{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:100vh}aside{padding:30px 22px;border-right:1px solid var(--line);background:#eaece4;position:sticky;top:0;height:100vh;overflow:auto}.brand{font-size:25px;letter-spacing:3px;font-weight:750;text-decoration:none}.eyebrow{font-size:11px;font-weight:700;letter-spacing:2px;color:var(--muted);text-transform:uppercase}.sidebar-bottom{margin-top:35px;padding-top:20px;border-top:1px solid #cdd2c5;font-size:12px;color:var(--muted)}main{padding:32px 5vw;min-width:0;max-width:1580px;width:100%;margin:0 auto}h1{font-size:clamp(28px,3vw,44px);letter-spacing:-1.5px;line-height:1.2;margin:14px 0}p.lead{color:var(--muted);margin:16px 0 28px}input,select{padding:13px 15px;background:#fff;border:1px solid var(--line);border-radius:6px}.back{border:1px solid var(--line);border-radius:6px;background:white;padding:8px 14px}.reader-grid{display:grid;grid-template-columns:minmax(0,1fr) 190px;gap:30px;margin-top:24px}article{background:#fff;border:1px solid var(--line);border-radius:8px;padding:clamp(20px,4vw,48px);overflow-wrap:anywhere}article h1{font-size:30px}article h2{font-size:23px;border-top:1px solid var(--line);padding-top:26px;margin-top:32px}article h3{font-size:18px}article p,article li{line-height:1.85}article pre{overflow:auto;background:#f2f4ef;padding:18px;border-radius:6px;font-size:12px}article code{font-family:Consolas,monospace;background:#f2f4ef;padding:2px 4px}article table{display:block;overflow:auto;border-collapse:collapse;font-size:13px}article td,article th{border:1px solid var(--line);padding:10px 13px;text-align:left}article th{background:#f2f4ef}article blockquote{border-left:3px solid #bb9c52;margin:20px 0;padding:8px 20px;background:#fcf8ee;color:#655b43}#toc{position:sticky;top:25px;align-self:start;font-size:12px;max-height:85vh;overflow:auto}#toc a{display:block;text-decoration:none;color:var(--muted);padding:6px 0}#toc a:hover{color:var(--accent)}.notice{color:var(--muted);font-size:12px;margin-top:10px}[hidden]{display:none!important}@media(max-width:1000px){.reader-grid{grid-template-columns:minmax(0,1fr)}#toc{position:static;grid-row:1;max-height:150px;border-bottom:1px solid var(--line)}}@media(max-width:720px){.shell{display:block}aside{position:static;height:auto;padding:18px;border-right:0;border-bottom:1px solid var(--line)}.sidebar-bottom{display:none}.brand{font-size:20px}main{padding:25px 18px}}

ding-top:8px;border-top:1px dashed var(--line)}}
.record-actions{display:flex;flex-wrap:wrap;align-items:center;justify-content:flex-end;gap:10px}.record-actions button,#test-feedback-panel button{padding:9px 13px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--accent)}.record-actions .notice{margin:0;flex-basis:100%;text-align:right}#test-feedback-panel{scroll-margin-top:24px;margin:24px 0 40px;padding:24px;border:1px solid var(--line);border-radius:12px;background:#fff}#test-feedback-panel h2{margin-top:0}#test-feedback-panel>button{margin:8px 8px 0 0}#test-feedback-panel #test-feedback-submit{background:var(--accent);color:#fff}#test-feedback-fields{margin:20px 0;border:1px solid var(--line);border-radius:8px;padding:18px}.feedback-field{display:block;margin:0 0 16px}.feedback-field>span{display:block;margin-bottom:6px;font-size:13px}.feedback-field input,.feedback-field textarea{width:100%;padding:12px;font:inherit;border:1px solid var(--line);border-radius:6px;resize:vertical}.feedback-options{display:flex;flex-wrap:wrap;gap:12px;margin:16px 0}.feedback-options label{display:flex;align-items:center;gap:8px;padding:12px 18px;border:1px solid var(--line);border-radius:7px;cursor:pointer}.feedback-options input{flex:0 0 auto;accent-color:var(--accent)}.feedback-options label:has(input:checked){border-color:var(--accent);background:#edf7ef}@media(max-width:1000px){.record-actions{grid-column:1/-1;justify-content:flex-start}.record-actions .notice{text-align:left}}@media(max-width:600px){#test-feedback-panel{padding:18px}#test-feedback-fields{padding:12px}}
#task-phase h3{font-size:16px;margin:20px 0 4px}#task-phase h3:first-of-type{margin-top:4px}.check-item{position:relative;margin:10px 0;padding:14px 16px;border:1px solid var(--line);border-radius:10px;background:#fff}.check-item.marked{padding-left:50px}.check-item.ai{background:#f7f8f4}.check-item>strong{display:block;font-size:15px}.check-mark{position:absolute;left:16px;top:15px;box-sizing:border-box;width:20px;height:20px;border:2px solid #b7bcb2;border-radius:5px;background:#fff;color:#fff;font-size:13px;font-weight:700;line-height:16px;text-align:center}.check-mark.pass{background:var(--accent);border-color:var(--accent)}.check-mark.fail{background:#b3402d;border-color:#b3402d}.check-mark.skip{background:#b98a2c;border-color:#b98a2c}.check-state{display:inline-block;margin-top:4px;font-size:12px;color:var(--muted)}.check-item p{margin:6px 0}.check-item .feedback-options{margin:12px 0 4px}
#new-task-fields{margin:20px 0;border:1px solid var(--line);border-radius:8px;padding:18px}#test-feedback-panel #new-task-submit{background:var(--accent);color:#fff}#test-feedback-panel button:disabled{opacity:.5;cursor:not-allowed}#test-feedback-panel details{margin:14px 0}#test-feedback-panel summary{cursor:pointer;color:var(--accent)}#task-request{padding:14px 18px;border:1px solid var(--line);border-radius:8px}#task-request[open]>summary{margin-bottom:8px}#task-phase .plan-preview{max-height:none;padding:14px;border:1px solid var(--line);border-radius:6px;background:#f8f8f5}@media(max-width:600px){.record-heading{flex-wrap:wrap}#new-task-fields{padding:12px}}

<body>
<div class="shell" id="app-shell">
<aside id="sidebar"><a class="brand" id="brand" href="#">WX / WORKFLOW</a><nav class="nav" id="nav" aria-label="문서 분류"></nav><label class="ai-choice">처리할 AI<select id="ai-provider" aria-label="처리할 AI"></select></label><div class="sidebar-bottom" id="stamp"></div></aside>
<main>
<section id="dashboard"><div class="eyebrow">Workflow</div><h1 id="dashboard-title">작업 현황 대시보드</h1><p class="lead">새 작업을 시작하거나, 확인할 일을 골라 이어가세요.</p><section id="task-records" aria-label="작업 기록 현황"></section><section id="test-feedback-panel" aria-label="작업 진행" hidden></section><p class="notice">AI가 조사·구현·검증하고, 사람은 판단합니다.</p></section>

<script>
'use strict';
const data=JSON.parse(document.getElementById('wiki-data').textContent), docs=data.documents;
const $=id=>document.getElementById(id);
const appTitle='WX · Workflow';

function el(tag,text,cls){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n;}
function route(path,anchor=''){return '#'+encodeURIComponent(path)+(anchor?'!'+encodeURIComponent(anchor):'');}
$('stamp').textContent='생성 · '+data.generated;
{const section=el('div',undefined,'nav-group');
for(const [title,href] of [['작업 현황 대시보드','#'],['작업 절차',route('.agents/workflow/process/index.md')]]){const link=el('a',title);link.href=href;link.dataset.route=href;section.append(link);}$('nav').append(section);}
// Markdown is content, never an executable part of the viewer.
// 문서와 구현 계획의 Markdown은 순정 marked로 그리고, 결과는 안전 필터를 거친다.
// 한국어 범위 표기(1~3)의 물결표가 짝지어 취소선이 되지 않도록 취소선은 ~~두 개~~만 인정한다.
marked.use({ tokenizer: { del(src) { return src[0] === '~' && src[1] !== '~' ? { type: 'text', raw: '~', text: '~' } : false; } } });
function renderMarkdown(text) { return safeFragment(marked.parse(text)); }
function safeFragment(html) {
  const parsed = new DOMParser().parseFromString(html, 'text/html');
  const allowed = new Set('P H1 H2 H3 H4 H5 H6 UL OL LI BLOCKQUOTE PRE CODE TABLE THEAD TBODY TR TH TD STRONG EM DEL A HR BR DIV SPAN SUP SUB DETAILS SUMMARY'.split(' '));
  for (const n of [...parsed.body.querySelectorAll('*')]) {
    if (!allowed.has(n.tagName)) { n.remove(); continue; }
    for (const a of [...n.attributes]) if (!(n.tagName === 'A' && a.name === 'href') && a.name !== 'id' && !(a.name === 'class' && ((n.tagName === 'CODE' && a.value === 'language-mermaid') || (n.tagName === 'PRE' && a.value === 'mermaid')))) n.removeAttribute(a.name);
  }
  return parsed.body;
}
__WX_DIAGRAM_SCRIPT__
function resolvePath(base,relative){const parts=base.split('/');parts.pop();for(const part of relative.replace(/\\/g,'/').split('/')){if(part==='..')parts.pop();else if(part&&part!=='.')parts.push(part);}return parts.join('/');}
function renderDocumentNotes(doc) {
  let notes=$('article').querySelector('#document-notes');
  if(!notes){notes=el('details');notes.id='document-notes';notes.append(el('summary','출처·검증 및 참고 정보'));$('article').append(notes);}
  notes.open=false;
  const metadata=$('metadata');
  metadata.replaceChildren(el('p','문서 경로: '+doc.path));
  notes.append(metadata);
}
function readRoute(){document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('active',(location.hash.split('!')[0]||'#')===a.dataset.route));if(!location.hash||location.hash==='#'){$('dashboard').hidden=false;$('reader').hidden=true;document.title=appTitle;renderWorkSummary();return;}let path,anchor;try{[path,anchor]=location.hash.slice(1).split('!').map(decodeURIComponent);}catch{location.hash='';return;}const d=docs.find(x=>x.path===path);$('dashboard').hidden=true;$('reader').hidden=false;$('toc').replaceChildren();if(!d){$('reader').append($('metadata'));$('metadata').textContent='';$('article').replaceChildren(el('h1','문서를 찾을 수 없습니다.'),el('p',path));return;}document.title=d.title+' · '+appTitle;const body=renderMarkdown(d.text);$('reader').append($('metadata'));$('article').replaceChildren(...body.childNodes);renderDocumentNotes(d);renderWikiDiagrams();for(const a of $('article').querySelectorAll('a')){const href=a.getAttribute('href')||'';a.removeAttribute('href');if(/^https?:\/\//i.test(href)){a.href=href;a.target='_blank';a.rel='noopener noreferrer';continue;}if(/^[a-z][a-z0-9+.-]*:/i.test(href)||href.startsWith('//'))continue;let target,section;try{[target,section]=href.split('#').map(decodeURIComponent);}catch{continue;}const dest=target?resolvePath(d.path,target):d.path;if(docs.some(x=>x.path===dest)){a.href=route(dest,section);continue;}if(/\.(?:h|hpp|cpp|c|cs|ini|json|uplugin|uproject|ps1|cjs|js|bat|txt)$/i.test(dest)){a.replaceWith(el('code',a.textContent));}else{a.replaceWith(...a.childNodes);}}
let i=0;for(const heading of $('article').querySelectorAll('h2,h3')){if(heading.closest('details'))continue;if(!heading.id)heading.id='section-'+(++i);const a=el('a',heading.textContent);a.href=route(d.path,heading.id);if(heading.tagName==='H3')a.style.paddingLeft='12px';$('toc').append(a);}if(anchor){const target=[...$('article').querySelectorAll('[id]')].find(n=>n.id===anchor);if(target){for(let parent=target.parentElement;parent;parent=parent.parentElement)if(parent.tagName==='DETAILS')parent.open=true;target.scrollIntoView();}}else window.scrollTo(0,0);}
__WX_WORKFLOW_SCRIPT__
$('back').onclick=()=>{location.hash='';};window.addEventListener('hashchange',readRoute);renderProviderChoice();readRoute();

</script>
