<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'none'; connect-src 'none'; base-uri 'none'; form-action 'none'">
<title>WX · Knowledge Atlas</title>
<style>
:root{color-scheme:light;--bg:#f4f3ef;--ink:#222b29;--muted:#65716b;--line:#dedfd7;--accent:#245c48}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.65 'Segoe UI','Malgun Gothic',sans-serif}button,input,select{font:inherit}button,a,select{touch-action:manipulation}button{cursor:pointer}a{color:var(--accent)}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #b37c2b;outline-offset:3px}.shell{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:100vh}aside{padding:30px 22px;border-right:1px solid var(--line);background:#eaece4;position:sticky;top:0;height:100vh;overflow:auto}.brand{font-size:25px;letter-spacing:3px;font-weight:750;text-decoration:none}.eyebrow{font-size:11px;font-weight:700;letter-spacing:2px;color:var(--muted);text-transform:uppercase}.side-note{color:var(--muted);font-size:12px;margin:22px 0 35px}.nav{display:grid;gap:6px}.nav button{background:transparent;border:0;text-align:left;padding:10px 12px;border-radius:6px;color:var(--ink);display:flex;justify-content:space-between}.nav button.active{background:var(--accent);color:white}.nav small{opacity:.7}.sidebar-bottom{margin-top:35px;padding-top:20px;border-top:1px solid #cdd2c5;font-size:12px;color:var(--muted)}main{padding:32px 5vw;min-width:0;max-width:1580px;width:100%;margin:auto}header{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:32px}.stamp{font-size:12px;color:var(--muted)}h1{font-size:clamp(28px,3vw,44px);letter-spacing:-1.5px;line-height:1.2;margin:14px 0}p.lead{color:var(--muted);margin:16px 0 28px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:30px 0}.stat{padding:18px;background:#fff;border:1px solid var(--line);border-radius:8px}.stat strong{font-size:28px;display:block;font-weight:600}.stat span{font-size:12px;color:var(--muted)}.tools{display:flex;gap:12px;margin:24px 0}input{flex:1;min-width:0}input,select{padding:13px 15px;background:#fff;border:1px solid var(--line);border-radius:6px}.count{font-size:13px;color:var(--muted);margin-bottom:15px}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}.card{display:block;padding:23px;background:#fff;border:1px solid var(--line);border-radius:8px;text-decoration:none;color:inherit;transition:transform .15s,border-color .15s}.card:hover{transform:translateY(-2px);border-color:var(--accent)}.card h2{font-size:19px;line-height:1.45;margin:15px 0 10px}.card p{font-size:13px;color:var(--muted);margin:10px 0;overflow-wrap:anywhere}.card .path{font-size:11px}.badge{display:inline-block;font-size:11px;line-height:1.5;border-radius:4px;padding:4px 8px;background:#edf0e9;color:#4c6555}.badge.needs-review{background:#fbefd4;color:#8b6314}.badge.blocked{background:#f8e1dc;color:#a04330}.badge.historical,.badge.untracked{background:#ededeb;color:#666}.empty{padding:40px;background:white;border:1px dashed var(--line);border-radius:8px}.back{border:1px solid var(--line);border-radius:6px;background:white;padding:8px 14px}.reader-grid{display:grid;grid-template-columns:minmax(0,1fr) 190px;gap:30px;margin-top:24px}article{background:#fff;border:1px solid var(--line);border-radius:8px;padding:clamp(20px,4vw,48px);overflow-wrap:anywhere}article h1{font-size:30px}article h2{font-size:23px;border-top:1px solid var(--line);padding-top:26px;margin-top:32px}article h3{font-size:18px}article p,article li{line-height:1.85}article pre{overflow:auto;background:#f2f4ef;padding:18px;border-radius:6px;font-size:12px}article code{font-family:Consolas,monospace;background:#f2f4ef;padding:2px 4px}article table{display:block;overflow:auto;border-collapse:collapse;font-size:13px}article td,article th{border:1px solid var(--line);padding:10px 13px;text-align:left}article th{background:#f2f4ef}article blockquote{border-left:3px solid #bb9c52;margin:20px 0;padding:8px 20px;background:#fcf8ee;color:#655b43}article img{display:none}#toc{position:sticky;top:25px;align-self:start;font-size:12px;max-height:85vh;overflow:auto}#toc a{display:block;text-decoration:none;color:var(--muted);padding:6px 0}#toc a:hover{color:var(--accent)}.source-note{padding:15px;background:#f2f4ef;font-size:12px;margin:15px 0;white-space:pre-wrap;overflow-wrap:anywhere}.source-link{cursor:pointer;text-decoration:underline dotted}.notice{color:var(--muted);font-size:12px;margin-top:10px}[hidden]{display:none!important}@media(max-width:1000px){.reader-grid{grid-template-columns:1fr}#toc{position:static;grid-row:1;max-height:150px;border-bottom:1px solid var(--line)}}@media(max-width:720px){.shell{display:block}aside{position:static;height:auto;padding:18px;border-right:0;border-bottom:1px solid var(--line)}.nav{grid-template-columns:repeat(3,1fr);gap:2px}.nav button{padding:7px;font-size:12px}.side-note,.sidebar-bottom{display:none}.brand{font-size:20px}.nav{margin-top:12px}main{padding:25px 18px}.stats{grid-template-columns:repeat(2,1fr)}header{margin-bottom:22px}.tools{flex-direction:column}.stamp{max-width:150px;text-align:right}}
</style>
</head>
<body>
<div class="shell">
<aside><a class="brand" href="#">WX<span style="color:#65836c"> / </span>WIKI</a><p class="side-note">프로젝트의 구조와 결정,<br>확인할 질문을 한곳에서.</p><nav class="nav" id="nav" aria-label="문서 분류"></nav><div class="sidebar-bottom">LOCAL KNOWLEDGE BASE<br><br>Markdown에서 생성한 읽기 전용 화면입니다. 문서 변경 후 <b>OpenWiki.bat</b>을 다시 실행하세요.</div></aside>
<main><header><div class="eyebrow">Woogle / Project Knowledge</div><div class="stamp" id="stamp"></div></header>
<section id="dashboard"><div class="eyebrow">Explore the project</div><h1>흩어진 지식을, 한눈에.</h1><p class="lead">구조를 찾고, 근거를 읽고, 아직 남은 질문을 확인하세요.</p><div class="stats" id="stats"></div><div class="tools"><input id="search" type="search" aria-label="문서 전체 검색" placeholder="문서 제목, 코드 심볼, 본문 검색… ( / )"><select id="status" aria-label="검증 상태"><option value="">모든 상태</option><option value="current">확인 완료 · 명시된 범위</option><option value="needs-review">재검토 필요</option><option value="blocked">확인 보류</option><option value="superseded">대체됨</option><option value="historical">과거 리뷰</option><option value="untracked">운영 문서</option></select></div><div id="count" class="count" aria-live="polite"></div><div id="cards" class="cards"></div></section>
<section id="reader" hidden><button class="back" id="back">← 문서 목록</button><div id="metadata" class="notice"></div><div id="source" class="source-note" hidden></div><div class="reader-grid"><article id="article"></article><nav id="toc" aria-label="현재 문서 목차"></nav></div></section>
<footer class="notice" style="margin-top:35px">검증 상태는 등록된 문서 메타데이터입니다. 현재 코드와의 일치 여부는 CheckWiki.ps1 및 원자료로 확인하세요.</footer>
</main></div>
<script id="wiki-data" type="application/json">__WX_WIKI_DATA__</script>
<script>
'use strict';
const data=JSON.parse(document.getElementById('wiki-data').textContent), docs=data.documents;
const $=id=>document.getElementById(id);
const labels={all:'전체 문서',modules:'모듈',systems:'시스템',questions:'미결정',decisions:'설계 결정',reports:'리뷰 · 검토',guide:'운영 안내'};
const states={'current':'확인 완료','needs-review':'재검토 필요',blocked:'확인 보류',superseded:'대체됨',historical:'과거 리뷰',untracked:'운영 문서'};
let category='all';
function el(tag,text,cls){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n;}
function route(path,anchor=''){return '#'+encodeURIComponent(path)+(anchor?'!'+encodeURIComponent(anchor):'');}
function badge(status){return el('span',states[status]||status,'badge '+status);}
$('stamp').textContent='생성 · '+data.generated;
for(const [key,label] of Object.entries(labels)){const b=el('button',label);b.append(el('small',docs.filter(d=>key==='all'||d.category===key).length));b.dataset.category=key;b.onclick=()=>{category=key;location.hash='';renderCards();};$('nav').append(b);}
for(const [label,value] of [['전체 문서',docs.length],['모듈',docs.filter(d=>d.category==='modules').length],['재검토 필요',docs.filter(d=>d.status==='needs-review').length],['확인 보류',docs.filter(d=>d.status==='blocked').length]]){const n=el('div',undefined,'stat');n.append(el('strong',value),el('span',label));$('stats').append(n);}
function renderCards(){const q=$('search').value.trim().toLocaleLowerCase(),tokens=q.split(/\s+/).filter(Boolean);const found=docs.filter(d=>(category==='all'||d.category===category)&&(!$('status').value||d.status===$('status').value)&&tokens.every(t=>(d.title+' '+d.text).toLocaleLowerCase().includes(t)));$('cards').replaceChildren();$('count').textContent=(labels[category]||category)+' · '+found.length+'개 문서';document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.category===category));for(const d of found){const a=el('a',undefined,'card');a.href=route(d.path);a.append(badge(d.status),el('h2',d.title));let summary=d.scope||d.text.replace(/^#.+$/gm,'').replace(/[>*`#|]/g,'').trim();if(q){const at=d.text.toLocaleLowerCase().indexOf(tokens[0]);if(at>=0)summary='…'+d.text.slice(Math.max(0,at-35),at+150);}a.append(el('p',summary.slice(0,180)),el('p',d.path,'path'));$('cards').append(a);}if(!found.length)$('cards').append(el('div','검색 결과가 없습니다. 검색어나 상태 필터를 바꿔보세요.','empty'));}
// Markdown is content, never an executable part of the viewer.
function safeFragment(html){const parsed=new DOMParser().parseFromString(html,'text/html');const allowed=new Set('P H1 H2 H3 H4 H5 H6 UL OL LI BLOCKQUOTE PRE CODE TABLE THEAD TBODY TR TH TD STRONG EM DEL A HR BR DIV SPAN SUP SUB'.split(' '));for(const n of [...parsed.body.querySelectorAll('*')]){if(!allowed.has(n.tagName)){n.remove();continue;}for(const a of [...n.attributes])if(!(n.tagName==='A'&&a.name==='href')&&a.name!=='id')n.removeAttribute(a.name);}return parsed.body;}
function resolvePath(base,relative){const parts=base.split('/');parts.pop();for(const part of relative.replace(/\\/g,'/').split('/')){if(part==='..')parts.pop();else if(part&&part!=='.')parts.push(part);}return parts.join('/');}
function readRoute(){if(!location.hash||location.hash==='#'){$('dashboard').hidden=false;$('reader').hidden=true;document.title='WX · Knowledge Atlas';renderCards();return;}let path,anchor;try{[path,anchor]=location.hash.slice(1).split('!').map(decodeURIComponent);}catch{location.hash='';return;}const d=docs.find(x=>x.path===path);$('dashboard').hidden=true;$('reader').hidden=false;$('source').hidden=true;$('toc').replaceChildren();if(!d){$('metadata').textContent='';$('article').replaceChildren(el('h1','문서를 찾을 수 없습니다.'),el('p',path));return;}document.title=d.title+' · WX Wiki';$('metadata').replaceChildren(badge(d.status),el('span','  '+d.path+(d.scope?' · '+d.scope:'')));const body=safeFragment(d.html);$('article').replaceChildren(...body.childNodes);for(const a of $('article').querySelectorAll('a')){const href=a.getAttribute('href')||'';a.removeAttribute('href');if(/^https?:\/\//i.test(href)){a.href=href;a.target='_blank';a.rel='noopener noreferrer';continue;}if(/^[a-z][a-z0-9+.-]*:/i.test(href)||href.startsWith('//'))continue;let target,section;try{[target,section]=href.split('#').map(decodeURIComponent);}catch{continue;}const dest=target?resolvePath(d.path,target):d.path;if(docs.some(x=>x.path===dest)){a.href=route(dest,section);continue;}a.className='source-link';a.href='#';a.onclick=e=>{e.preventDefault();$('source').hidden=false;$('source').textContent='원자료 · '+dest+'\n저장소에서 이 경로를 열어 확인하세요.';$('source').scrollIntoView({block:'nearest'});};}
let i=0;for(const heading of $('article').querySelectorAll('h2,h3')){if(!heading.id)heading.id='section-'+(++i);const a=el('a',heading.textContent);a.href=route(d.path,heading.id);if(heading.tagName==='H3')a.style.paddingLeft='12px';$('toc').append(a);}if(anchor){const target=[...$('article').querySelectorAll('[id]')].find(n=>n.id===anchor);if(target)target.scrollIntoView();}else window.scrollTo(0,0);}
$('search').addEventListener('input',renderCards);$('status').addEventListener('change',renderCards);$('back').onclick=()=>{location.hash='';};window.addEventListener('hashchange',readRoute);document.addEventListener('keydown',e=>{if(e.key==='/'&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){e.preventDefault();location.hash='';readRoute();$('search').focus();}});readRoute();
</script>
</body></html>
